[project]
name = "flog2-to-slog3"
version = "0.1.0"
description = "Convert cinema Log 3D LUTs (S-Log3 / F-Log2) into luminance-preserving Style LUTs for Adobe Camera Raw"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "colour-science>=0.4.7",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
]

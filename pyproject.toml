[project]
name = "flog2-to-slog3"
version = "0.1.0"
description = "Convert F-Log2 3D LUTs to Sony S-Log3/S-Gamut3.Cine (video) and luminance-preserving Style LUTs for Adobe Camera Raw (photo)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "colour-science>=0.4.7",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
probe = ["Pillow"]
